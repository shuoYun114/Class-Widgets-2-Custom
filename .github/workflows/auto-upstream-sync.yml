name: Auto Upstream Sync & Release (自动追随官方更新并打包)

on:
  # 每 6 小时自动巡检一次官方更新
  schedule:
    - cron: '0 */6 * * *'
  # 支持手动在 GitHub 页面一键触发
  workflow_dispatch:
    inputs:
      force_build:
        description: '即使上游无新更新也强制重新打包发布 (Force Build)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  sync-and-build:
    name: 🔄 检查上游、自动合并、测试与打包发布
    runs-on: windows-latest

    steps:
      - name: ⬇️ 检出二改分支代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔍 检查官方上游更新 (Check Upstream)
        id: check_upstream
        shell: pwsh
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # 添加上游官方仓库源
          $upstreamUrl = "https://github.com/RinLit-233-shiroko/Class-Widgets-2.git"
          $remotes = git remote
          if (-not ($remotes -contains "upstream")) {
            git remote add upstream $upstreamUrl
          }
          git fetch upstream main --tags

          $upstreamSha = (git rev-parse upstream/main).Trim()
          Write-Host "上游最新 Commit SHA: $upstreamSha"

          # 提取官方最新版本Tag（如 2.0.0.dev20260913）
          $upstreamTag = (git tag --points-at $upstreamSha | Select-Object -First 1)
          if (-not $upstreamTag) {
            $upstreamTag = (git tag -l "2.0.0.dev*" --sort=-creatordate | Select-Object -First 1)
          }
          if (-not $upstreamTag) {
            $upstreamTag = "2.0.0.dev$($upstreamSha.Substring(0, 8))"
          }
          Write-Host "上游最新版本Tag: $upstreamTag"

          # 读取上次同步基线
          $versionFile = ".upstream_version"
          $lastSha = ""
          if (Test-Path $versionFile) {
            $json = Get-Content $versionFile -Raw | ConvertFrom-Json
            $lastSha = $json.last_synced_commit
          }
          Write-Host "上次已同步 Commit SHA: $lastSha"

          $force = "${{ inputs.force_build }}" -eq "true"
          $hasUpdate = ($upstreamSha -ne $lastSha)

          if ($hasUpdate -or $force) {
            Write-Host "检测到官方新更新或强制触发构建，准备合并与打包！"
            echo "should_build=true" >> $env:GITHUB_OUTPUT
            echo "upstream_sha=$upstreamSha" >> $env:GITHUB_OUTPUT
            echo "upstream_tag=$upstreamTag" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "官方仓库尚无新提交，无需重复打包构建。"
            echo "should_build=false" >> $env:GITHUB_OUTPUT
          }

      - name: 🔀 自动合并官方最新代码 (Merge Upstream)
        if: steps.check_upstream.outputs.should_build == 'true'
        shell: pwsh
        run: |
          $upstreamSha = "${{ steps.check_upstream.outputs.upstream_sha }}"
          Write-Host "正在合并上游官方更新 ($upstreamSha) ..."
          
          # 执行平滑合并，增加二进制与语言包冲突智能消解防御
          git merge upstream/main -m "chore(upstream): 自动追随并合并官方最新代码 [$upstreamSha]" --no-commit
          $mergeExit = $LASTEXITCODE

          # 检查是否存在未合并冲突（优先防御 .qm 编译二进制冲突）
          $conflicts = git diff --name-only --diff-filter=U
          if ($conflicts) {
            Write-Host "检测到合并冲突，进入智能冲突消解与二进制修复流程..."
            Write-Host "未合并文件列表: $($conflicts -join ', ')"
            
            # 对于 .qm 等编译产物二进制文件，直接采纳上游版本或由后续 lrelease 重新生成
            foreach ($file in $conflicts) {
              if ($file -match '\.qm$') {
                Write-Host "自动解决二进制产物冲突: $file (采用 upstream)"
                git checkout --theirs -- $file
                git add -- $file
              }
            }
          }

          # 核心保护：二改定制仓库保留自身工作流，防止被上游修改且避免 GITHUB_TOKEN 权限拦截
          git checkout HEAD -- .github/workflows

          # 检查是否还有其他无法自动消解的源码文本冲突
          $remaining = git diff --name-only --diff-filter=U
          if ($remaining) {
            Write-Error "存在无法自动解决的源码文本冲突，请手动干预: $($remaining -join ', ')"
            git merge --abort
            exit 1
          }

          # 如果当前存在已解决并暂存的合并内容，执行合并提交
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "chore(upstream): 自动追随并合并官方最新代码 [$upstreamSha]"
          }

          # 更新基线版本记录文件与源码版本号
          $upstreamTag = "${{ steps.check_upstream.outputs.upstream_tag }}"
          $nowIso = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $record = @{
            upstream_repo = "RinLit-233-shiroko/Class-Widgets-2"
            last_synced_version = $upstreamTag
            last_synced_commit = $upstreamSha
            last_synced_at = $nowIso
          } | ConvertTo-Json -Depth 4
          Set-Content -Path ".upstream_version" -Value $record -Encoding UTF8

          if ($upstreamTag) {
            (Get-Content "src/__init__.py") -replace '__version__\s*=\s*".*?"', "__version__ = `"$upstreamTag`"" | Set-Content "src/__init__.py"
            git add src/__init__.py
          }
          
          git add .upstream_version
          $diff = git diff --staged
          if ($diff) {
            git commit -m "chore(version): 追随官方最新版本基线 [$upstreamTag / $upstreamSha]"
          }

      - name: 📦 配置 Python 与 uv 环境
        if: steps.check_upstream.outputs.should_build == 'true'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 📥 安装依赖与打包工具
        if: steps.check_upstream.outputs.should_build == 'true'
        shell: pwsh
        run: |
          uv sync
          uv pip install pyinstaller pytest
          Write-Host "正在编译最新的多语言 .qm 产物..."
          uv run python -c "import glob, subprocess; [subprocess.run(['pyside6-lrelease', ts, '-qm', ts[:-3] + '.qm']) for ts in glob.glob('assets/locales/*.ts')]"
          git add assets/locales/*.qm
          $diff = git diff --staged
          if ($diff) {
            git commit -m "chore(i18n): 自动重编译所有多语言 .qm 产物"
          }

      - name: 🧪 运行自动化测试门禁 (Run 141 E2E Tests)
        if: steps.check_upstream.outputs.should_build == 'true'
        shell: pwsh
        run: |
          Write-Host "正在执行全量回归与对抗测试套件..."
          uv run pytest tests/e2e/

      - name: 🔨 自动打包 Windows EXE 应用程序 (Build EXE)
        if: steps.check_upstream.outputs.should_build == 'true'
        shell: pwsh
        run: |
          Write-Host "开始执行自动化 EXE 编译打包..."
          uv run python scripts/build_exe.py

      - name: 🚀 推送合并后的最新代码到个人仓库
        if: steps.check_upstream.outputs.should_build == 'true'
        shell: pwsh
        run: |
          git push origin main

      - name: 🏷️ 生成发布标签并发布 GitHub Release
        if: steps.check_upstream.outputs.should_build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: "Class Widgets ${{ steps.check_upstream.outputs.upstream_tag }} (侧边课表与大屏定制版)"
          tag_name: "v${{ steps.check_upstream.outputs.upstream_tag }}"
          draft: false
          prerelease: true
          make_latest: true
          generate_release_notes: true
          body: |
            ## 🎉 官方最新版本同步构建完成 (版本号：${{ steps.check_upstream.outputs.upstream_tag }})
            
            本版本已全量追随并合并官方仓库 [RinLit-233-shiroko/Class-Widgets-2](https://github.com/RinLit-233-shiroko/Class-Widgets-2) 的 **${{ steps.check_upstream.outputs.upstream_tag }}** 最新代码。
            
            ### ✨ 官方最新更新（包含）：
            - **课程表编辑器重构**：排课 UI 重构、支持多选指定周设置。
            - **课表转换拆分与健壮性提升**：支持多个指定周配置解析。
            - **活动排版修复**：滚动字幕在不可见子项下的宽度排版自适应修复。
            
            ### 🔥 独家定制增强功能：
            - **教室大屏课表文字调节 (10px ~ 32px)**：在设置中支持随意调节课表文字大小，自适应宽度延展与高度呼吸放大，大屏字号（>=16px）自动加粗，坐在教室后排也能清晰看清课表！
            - **极简胶囊当天课表竖条**：屏幕边缘常驻半透明悬浮，随时间线自动高亮当前课程与动态进度。
            - **全周网格矩阵大面板**：整周所有课程全景一览，字号与大屏设置实时联动。
            - **系统级 100% 桌面穿透**：无任何点击阻挡，支持在空白处随意右键唤出系统菜单。
            - **满帧 GPU 级丝滑动画**：纯硬件 Translate 变换。
            
            ### 📥 下载与使用：
            下载下方的 **`ClassWidgets-2-Windows.zip`**，解压后双击 **`Class Widgets 2.exe`** 即可使用。
          files: |
            dist/ClassWidgets-2-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
